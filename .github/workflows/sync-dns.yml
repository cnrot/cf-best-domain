name: Sync DNS

on:
  workflow_run:
    workflows: [Fetch IPs]
    types: [completed]
  workflow_dispatch:  # 手动触发（方便测试）

jobs:
  update-dns:
    # 仅在 Fetch IPs 成功完成后执行，严格顺序：先更新 ip.txt 再同步 DNS
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 拉取最新代码（含 ip.txt 的最新提交）

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'  # 你可以指定需要的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml
        pip install 'huaweicloudsdkdns' 'huaweicloudsdkcore'  # 华为云 DNS SDK

    - name: Run update script
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
        HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}
      run: |
        python bestdomain.py
