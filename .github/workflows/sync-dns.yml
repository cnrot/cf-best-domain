name: Sync DNS

on:
  schedule:
    - cron: '*/30 * * * *'  # 每隔三十分钟运行一次
  workflow_dispatch:  # 手动触发
  push:               # 允许提交触发（方便测试）

jobs:
  update-dns:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'  # 你可以指定需要的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml
        pip install 'huaweicloudsdkdns' 'huaweicloudsdkcore'  # 华为云 DNS SDK

    - name: Run update script
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
        HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}
      run: |
        python bestdomain.py
