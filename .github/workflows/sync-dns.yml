name: Sync DNS

on:
  schedule:
    - cron: '10,40 * * * *'  # 每小时的 10/40 分运行，错开采集(*/30)约 10 分钟，等 Raw 缓存刷新
  workflow_dispatch:  # 手动触发（方便测试）

jobs:
  update-dns:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 拉取最新代码（含 ip.txt 的最新提交）

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'  # 你可以指定需要的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml
        pip install 'huaweicloudsdkdns' 'huaweicloudsdkcore'  # 华为云 DNS SDK

    - name: Run update script
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        ZONE_CLOUDFLARE: ${{ secrets.ZONE_CLOUDFLARE }}   # 隐藏的 CF 托管域名
        HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
        HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}
        ZONE_HUAWEICLOUD: ${{ secrets.ZONE_HUAWEICLOUD }} # 隐藏的华为云托管域名
        HUAWEICLOUD_SDK_PROJECT_ID: ${{ secrets.HUAWEICLOUD_SDK_PROJECT_ID }}  # 隐藏的华为云项目ID
      run: |
        python bestdomain.py
