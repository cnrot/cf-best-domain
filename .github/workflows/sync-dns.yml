name: Sync DNS

on:
  schedule:
    - cron: '10,40 * * * *'  # 每小时的 10/40 分运行，错开采集(*/30)约 10 分钟，等 Raw 缓存刷新
  workflow_dispatch:  # 手动触发（方便测试）

jobs:
  update-dns:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # 拉取最新代码（含 ip.txt 的最新提交）

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'  # 你可以指定需要的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml
        pip install 'huaweicloudsdkdns' 'huaweicloudsdkcore'  # 华为云 DNS SDK

    - name: Run update script
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        # 直接单域名 Secret 方式（域名段 zone_env: CF_ZONE）
        CF_ZONE: ${{ secrets.CF_ZONE }}
        # JSON 映射方式（域名段 zone_env: CF_ZONES + zone_key: x），多域名共用一个 Secret
        # 真实域名塞进 CF_ZONES，如 {"a":"a.com","b":"b.net"}
        CF_ZONES: ${{ secrets.CF_ZONES }}
        HUAWEICLOUD_SDK_AK: ${{ secrets.HUAWEICLOUD_SDK_AK }}
        HUAWEICLOUD_SDK_SK: ${{ secrets.HUAWEICLOUD_SDK_SK }}
        # 华为云单域名方式
        HUAWEI_ZONE: ${{ secrets.HUAWEI_ZONE }}
        HUAWEI_ZONE_PROJECT: ${{ secrets.HUAWEI_ZONE_PROJECT }}
        # 华为云 JSON 映射方式（域名段 zone_env: HUAWEI_ZONES + zone_key: x）
        HUAWEI_ZONES: ${{ secrets.HUAWEI_ZONES }}
      run: |
        python bestdomain.py
